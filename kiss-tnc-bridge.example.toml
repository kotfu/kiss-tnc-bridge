# kiss-tnc-bridge configuration
#
# This is /etc/kiss-tnc-bridge/kiss-tnc-bridge.toml. More bridges can go in
# /etc/kiss-tnc-bridge/conf.d/*.toml, conventionally one bridge per file.
# Check everything with:  kiss-tnc-bridge -t
#
# A bridge connects one KISS TNC to any number of apps. Each bridge has one
# TNC port (where the radio or software TNC is) and one or more app ports
# (where apps attach, over BLE or TCP). Keep a bridge for each setup and
# enable the one that matches the hardware you have with you.

[global]
# Log level: trace, debug, info, warn, error
log_level = "info"

# Default Bluetooth adapter for ble-server ports and TNCs: an [[adapter]]
# id, a MAC, or hciN. Leave it out to use the first adapter BlueZ has.
# adapter = "builtin"

# Give adapters readable ids. hciN numbers can change when a dongle is
# plugged in; MACs don't.
# [[adapter]]
# id = "builtin"
# mac = "B8:27:EB:12:34:56"

# A hardware TNC, here the one built into a Kenwood TH-D75, with the two
# ways to reach it. Pair it once with bluetoothctl (see the README).
# [[tnc]]
# id = "d75"
# name = "TH-D75"
# model = "th-d75"            # puts it in KISS mode: th-d74, th-d75, or none
#
#   [tnc.spp]                 # over Bluetooth
#   address = "00:11:22:33:44:55"
#   # adapter = "builtin"     # the adapter it's paired on
#
#   [tnc.serial]              # over its USB cable
#   path = "/dev/serial/by-id/usb-JVCKENWOOD_TH-D75-if00"

# The TH-D75 over Bluetooth, shared to phones over BLE.
# [[bridge]]
# id = "ktbr0"
# name = "TH-D75"
#
#   [[bridge.port]]
#   id = "radio"
#   type = "spp-client"       # or type = "serial" for the USB cable
#   tnc = "d75"
#   idle_timeout = "90s"      # keep the radio link up briefly between apps
#
#   [[bridge.port]]
#   id = "phones"
#   type = "ble-server"

# A software TNC such as Dire Wolf or Graywolf, shared to phones over BLE and
# to apps on this machine over TCP.
# [[bridge]]
# id = "ktbr1"
# name = "Graywolf"            # what phones see; must be unique
# enabled = false              # only one bridge can use a BLE adapter at a time
#
#   [[bridge.port]]
#   id = "tnc"
#   type = "tcp-client"
#   address = "127.0.0.1:6700"
#
#   [[bridge.port]]
#   id = "phones"
#   type = "ble-server"
#   # adapter = "builtin"
#   max_clients = 2           # many Bluetooth chips can only serve one
#
#   [[bridge.port]]
#   id = "local"
#   type = "tcp-server"
#   listen = "8001"           # a TCP port number alone binds 127.0.0.1
#   # listen = "wlan0:8001"   # or only on one interface
#   # allow = ["192.168.4.0/24"]
#   # Anyone who can reach a tcp-server can transmit under your callsign.
#   # Ports reachable from the network are announced with DNS-SD
#   # (_kiss-tnc._tcp) so apps can find them; set announce = false to stop it.
