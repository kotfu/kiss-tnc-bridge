[package]
name = "kiss-tnc-bridge"
version = "1.3.0-rc1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "KISS switchboard: bridges KISS TNCs to apps over BLE and TCP"
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
futures = "0.3"
libc = "0.2"
uuid = "1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
serde_json = "1"
# JSON Schema for the control protocol, exported by a test; not in the daemon.
schemars = { version = "1", optional = true }
# dynamic.toml: edits that keep comments and formatting.
toml_edit = "0.25"
ipnet = "2.12.2"
tokio-util = { version = "0.7.20", features = ["rt"] }
# No libudev: devices are found by path, so cross builds need no C library.
tokio-serial = { version = "5.4", default-features = false }
# ktbctl device flash: the ESP32 ROM bootloader protocol and its flasher
# stub, as a library. Its serialport has default features off: no libudev.
espflash = { version = "4.7", default-features = false, features = ["serialport"] }
# Checking firmware parts against their manifest.
sha2 = "0.11"
# ktbctl device flash: firmware releases from GitHub, over rustls (no OpenSSL).
ureq = { version = "3", default-features = false, features = ["rustls"] }
# ktbctl's TUI.
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }

[features]
schema = ["dep:schemars"]

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd", "rfcomm"] }
libdbus-sys = { version = "0.2", features = ["vendored"] }
# Avahi for DNS-SD; the same versions bluer uses.
dbus = { version = "0.9", features = ["futures"] }
dbus-tokio = "0.7"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = true
lto = true

[package.metadata.deb]
maintainer = "kotfu"
copyright = "2026"
revision = ""
depends = "$auto, bluez"
section = "net"
assets = [
    ["target/release/kiss-tnc-bridge", "usr/bin/", "755"],
    ["target/release/ktbctl", "usr/bin/", "755"],
    ["kiss-tnc-bridge.example.toml", "usr/share/kiss-tnc-bridge/kiss-tnc-bridge.example.toml", "644"],
    ["kiss-tnc-bridge.service", "lib/systemd/system/", "644"],
    ["70-kiss-tnc-bridge.rules", "lib/udev/rules.d/", "644"],
]
maintainer-scripts = "debian/"

[package.metadata.generate-rpm]
release = "1"
assets = [
    { source = "target/release/kiss-tnc-bridge", dest = "/usr/bin/kiss-tnc-bridge", mode = "755" },
    { source = "target/release/ktbctl", dest = "/usr/bin/ktbctl", mode = "755" },
    { source = "kiss-tnc-bridge.example.toml", dest = "/etc/kiss-tnc-bridge/kiss-tnc-bridge.toml", mode = "644", config = "noreplace" },
    { source = "kiss-tnc-bridge.example.toml", dest = "/usr/share/kiss-tnc-bridge/kiss-tnc-bridge.example.toml", mode = "644" },
    { source = "kiss-tnc-bridge.service", dest = "/lib/systemd/system/kiss-tnc-bridge.service", mode = "644" },
    { source = "70-kiss-tnc-bridge.rules", dest = "/usr/lib/udev/rules.d/70-kiss-tnc-bridge.rules", mode = "644" },
]
requires = { bluez = "*" }
pre_install_script = "rpm/pre-install.sh"
post_install_script = "rpm/post-install.sh"
