# Spike: throwaway code. See spikes/README.md.
[package]
name = "espflash-usb"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# The library only: no CLI, no update check. Its serialport has default
# features off, so no libudev.
espflash = { version = "4.7", default-features = false, features = ["serialport"] }
serialport = { version = "4.7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
env_logger = "0.11"

[profile.release]
strip = true
lto = true
